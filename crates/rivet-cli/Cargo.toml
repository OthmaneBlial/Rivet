[package]
name = "rivet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
rivet-core = { path = "../rivet-core" }
rivet-runner = { path = "../rivet-runner" }
rivet-scm = { path = "../rivet-scm" }
rivet-server = { path = "../rivet-server" }
rivet-storage = { path = "../rivet-storage" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true
