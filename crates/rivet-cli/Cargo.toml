[package]
name = "rivet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
globset.workspace = true
hex.workspace = true
futures-util = "0.3"
rivet-auth = { path = "../rivet-auth" }
rivet-core = { path = "../rivet-core" }
rivet-agent-protocol = { path = "../rivet-agent-protocol" }
rivet-credentials = { path = "../rivet-credentials" }
rivet-compat = { path = "../rivet-compat" }
rivet-migration = { path = "../rivet-migration" }
rivet-runner = { path = "../rivet-runner" }
rivet-scm = { path = "../rivet-scm" }
rivet-server = { path = "../rivet-server" }
rivet-storage = { path = "../rivet-storage" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true
