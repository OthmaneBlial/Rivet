[package]
name = "rivet-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono.workspace = true
hex.workspace = true
futures-util = "0.3"
hmac.workspace = true
rivet-agent-protocol = { path = "../rivet-agent-protocol" }
rivet-core = { path = "../rivet-core" }
rivet-runner = { path = "../rivet-runner" }
rivet-scm = { path = "../rivet-scm" }
rivet-storage = { path = "../rivet-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
