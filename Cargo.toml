[workspace]
members = [
    "crates/rivet-core",
    "crates/rivet-agent-protocol",
    "crates/rivet-extension-protocol",
    "crates/rivet-auth",
    "crates/rivet-compat",
    "crates/rivet-credentials",
    "crates/rivet-migration",
    "crates/rivet-runner",
    "crates/rivet-scm",
    "crates/rivet-server",
    "crates/rivet-storage",
    "crates/rivet-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OthmaneBlial/Rivet"

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
cron = "0.17"
hex = "0.4"
globset = "0.4"
hmac = "0.12"
keyring = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2.5"
